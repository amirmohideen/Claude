name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldFX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            app/build/reports/

      # A fixed "test-build" release, so the newest APK is always one tap away on a phone.
      - name: Publish test build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FoldFX-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build FoldFX-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "FoldFX test build" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Download FoldFX-test.apk on your phone and open it to install."
